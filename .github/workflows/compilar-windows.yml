name: Compilar IFOP para Windows

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas openpyxl matplotlib dbfread xlsxwriter pyinstaller

      - name: Crear ejecutable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name ifop_consolidado main.py

      - name: Preparar paquete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path paquete\IFOP
          Copy-Item dist\IFOP.exe paquete\IFOP\
          Copy-Item configuracion.txt paquete\IFOP\
          Copy-Item README.md paquete\IFOP\
          Set-Content -Path paquete\IFOP\Ejecutar_IFOP.bat -Value "@echo off", "IFOP.exe", "pause"

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: IFOP-Windows
          path: paquete/IFOP
          retention-days: 30