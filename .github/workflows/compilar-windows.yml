name: Compilar IFOP para Windows

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verificar archivos necesarios
        shell: pwsh
        run: |
          $archivos = @(
            "main.py",
            "configuracion.py",
            "configuracion.txt",
            "lectura.py",
            "analisis_colocap.py",
            "regresion.py",
            "clave_pesotalla.py",
            "matriz_de_composicion.py",
            "metodos_matematicos.py",
            "diseno_composicion.py",
            "claves_edad_merluza.py",
            "claves_edad_bacalao.py",
            "plantillas_composicion/merluza_machos.xlsx",
            "plantillas_composicion/merluza_hembras.xlsx",
            "plantillas_composicion/bacalao_machos.xlsx",
            "plantillas_composicion/bacalao_hembras.xlsx"
          )
          foreach ($archivo in $archivos) {
            if (-not (Test-Path -LiteralPath $archivo -PathType Leaf)) {
              throw "Falta un archivo necesario: $archivo"
            }
          }

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy openpyxl matplotlib dbfread pyinstaller

      - name: Crear ejecutable con las plantillas incluidas
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name Consolidado_IFOP --add-data "plantillas_composicion:plantillas_composicion" main.py
          if ($LASTEXITCODE -ne 0) {
            throw "Falló la creación del ejecutable."
          }
          if (-not (Test-Path -LiteralPath "dist/Consolidado_IFOP.exe" -PathType Leaf)) {
            throw "No se encontró Consolidado_IFOP.exe después de compilar."
          }

      - name: Comprobar que el ejecutable inicia sin inputs
        shell: pwsh
        run: |
          & .\dist\Consolidado_IFOP.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "El ejecutable no pudo iniciar correctamente."
          }

      - name: Preparar paquete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path paquete\IFOP | Out-Null
          Copy-Item -LiteralPath dist\Consolidado_IFOP.exe -Destination paquete\IFOP\
          Copy-Item -LiteralPath configuracion.txt -Destination paquete\IFOP\
          $lanzador = @(
            '@echo off',
            'cd /d "%~dp0"',
            '"Consolidado_IFOP.exe"',
            'pause'
          )
          Set-Content -LiteralPath paquete\IFOP\Ejecutar_IFOP.bat -Encoding Ascii -Value $lanzador

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: Consolidado_IFOP
          path: paquete/IFOP
          if-no-files-found: error
          retention-days: 30
