name: Compilar IFOP para Windows

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas openpyxl matplotlib dbfread xlsxwriter pyinstaller

      - name: Crear ejecutable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name IFOP main.py
          Get-ChildItem -Path dist -Recurse | Format-Table FullName

      - name: Preparar paquete
        shell: pwsh
        run: |
          $ejecutable = Get-ChildItem -Path dist -Recurse -Filter IFOP.exe | Select-Object -First 1

          if ($null -eq $ejecutable) {
            throw "No se encontró IFOP.exe dentro de la carpeta dist."
          }

          New-Item -ItemType Directory -Force -Path paquete\IFOP
          Copy-Item $ejecutable.FullName paquete\IFOP\
          Copy-Item configuracion.txt paquete\IFOP\
          Copy-Item README.md paquete\IFOP\
          Set-Content -Path paquete\IFOP\Ejecutar_IFOP.bat -Value "@echo off", "IFOP.exe", "pause"

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: IFOP-Windows
          path: paquete/IFOP
          retention-days: 30